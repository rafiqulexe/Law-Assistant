<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ "Register" if register else "Log in" }} - Law Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-card">
    <h1>⚖ Law Assistant</h1>
    <p>{{ "Create an account" if register else "Sign in to continue" }}</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>Username<input name="username" minlength="3" required></label>
      <label>Password<input name="password" type="password" minlength="8" required></label>
      <button type="submit">{{ "Register" if register else "Log in" }}</button>
    </form>
    {% if register %}<a href="{{ url_for('login') }}">Already registered? Log in</a>
    {% else %}<a href="{{ url_for('register') }}">Create an account</a>{% endif %}
  </main>
</body>
</html>
