<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Law Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="admin-card">
    <header class="topbar"><strong>Admin dashboard</strong><a href="{{ url_for('index') }}">Back to chat</a></header>
    <h2>Index a legal document</h2>
    <p>Supported formats: PDF and CSV. Uploads are added to the configured Pinecone index.</p>
    <form id="upload-form" enctype="multipart/form-data">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="file" name="document" accept=".pdf,.csv" required>
      <button type="submit">Upload and index</button>
    </form>
    <div id="upload-result"></div>
    <h2>Users</h2>
    <ul>{% for user in users %}<li>{{ user.username }}{% if user.is_admin %} (admin){% endif %}</li>{% endfor %}</ul>
  </main>
  <script>
    document.getElementById("upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await fetch("/admin/upload", {method: "POST", headers: {"X-CSRFToken": "{{ csrf_token() }}"}, body: new FormData(event.target)});
      const data = await result.json();
      document.getElementById("upload-result").textContent = data.message || data.error;
    });
  </script>
</body>
</html>
