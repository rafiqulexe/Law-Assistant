<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangladesh Law Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><strong>Law Assistant</strong><small>Bangladesh legal information</small></div>
      <nav>
        {% if current_user.is_admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
        <span>{{ current_user.username }}</span><a href="{{ url_for('logout') }}">Log out</a>
      </nav>
    </header>
    <section class="workspace">
      <aside class="history">
        <h2>Conversations</h2>
        <div id="conversation-list"></div>
      </aside>
      <section class="chat-panel">
        <div id="chat-box" class="chat-box">
          <div class="notice">Ask a question about the indexed legal documents. Responses are legal information, not legal advice.</div>
        </div>
        <form id="chat-form" class="input-row">
          <input id="message" autocomplete="off" placeholder="Ask in English or Bangla..." required>
          <button type="submit">Send</button>
        </form>
      </section>
    </section>
  </main>
  <script>
    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    let conversationId = null;

    function addMessage(role, content, citations = []) {
      const item = document.createElement("article");
      item.className = `message ${role}`;
      const text = document.createElement("p");
      text.textContent = content;
      item.appendChild(text);
      if (citations.length) {
        const source = document.createElement("small");
        source.textContent = `Sources: ${citations.join(", ")}`;
        item.appendChild(source);
      }
      chatBox.appendChild(item);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function loadConversations() {
      const response = await fetch("/api/conversations");
      if (!response.ok) return;
      const list = document.getElementById("conversation-list");
      (await response.json()).forEach((conversation) => {
        const button = document.createElement("button");
        button.textContent = conversation.title;
        button.onclick = async () => {
          conversationId = conversation.id;
          chatBox.replaceChildren();
          const history = await fetch(`/api/conversations/${conversation.id}`);
          (await history.json()).forEach((message) =>
            addMessage(message.role, message.content, message.citations ? message.citations.split("\n") : [])
          );
        };
        list.appendChild(button);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      addMessage("user", msg);
      input.value = "";
      const response = await fetch("/get", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded", "X-CSRFToken": "{{ csrf_token() }}"},
        body: new URLSearchParams({msg, conversation_id: conversationId || ""})
      });
      const data = await response.json();
      if (!response.ok) {
        addMessage("assistant", data.error || "The request failed.");
        return;
      }
      conversationId = data.conversation_id;
      addMessage("assistant", data.answer, data.citations);
      loadConversations();
    });

    loadConversations();
  </script>
</body>
</html>
